name: CI

permissions: {}

on:
  schedule:
    - cron: "0 */3 * * *" # Every 3 hours.
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      issue-number:
        required: false
        type: string
      comment-id:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  status:
    if: ${{ inputs.issue-number && inputs.comment-id }}
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: oxc-project
          repositories: |
            ${{ github.event.repository.name }}
            oxc

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_ID: ${{ inputs.comment-id }}
          OXC_REF: ${{ inputs.ref || 'main' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const commentId = Number(process.env.COMMENT_ID);
            const oxcRef = process.env.OXC_REF || 'main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let commitUrl = `${context.serverUrl}/oxc-project/oxc/tree/${oxcRef}`;
            let shortSha = oxcRef;
            try {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: 'oxc-project',
                repo: 'oxc',
                ref: oxcRef,
              });
              commitUrl = `${context.serverUrl}/oxc-project/oxc/commit/${commit.sha}`;
              shortSha = commit.sha.slice(0, 12);
            } catch (error) {
              console.warn(`Failed to resolve oxc ref "${oxcRef}": ${String(error)}`);
            }

            const emojiFor = (state) => ({
              success: ':white_check_mark:',
              failure: ':x:',
              cancelled: ':stop_button:',
              skipped: ':next_track_button:',
              in_progress: ':arrows_counterclockwise:',
              queued: ':hourglass:',
              waiting: ':hourglass:',
              pending: ':hourglass:',
            }[state] || ':hourglass:');

            const render = (jobs) => {
              const rows = jobs.map((j) => {
                const state = j.conclusion || j.status;
                const suite = j.name.replace(/^Test /, '');
                return `| [${suite}](${j.html_url}) | ${emojiFor(state)} |`;
              }).join('\n');
              return `## [Monitor Oxc](${runUrl})\n\nCommit: [\`${shortSha}\`](${commitUrl})\n\n| suite | result |\n|-------|--------|\n${rows}`;
            };

            for (let i = 0; i < 60; i++) {
              const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              const tracked = jobs.filter((j) =>
                j.name === 'Build' || j.name.startsWith('Test')
              );

              if (tracked.length > 0) {
                await github.rest.issues.updateComment({
                  owner: 'oxc-project',
                  repo: 'oxc',
                  comment_id: commentId,
                  body: render(tracked),
                });

                const build = tracked.find((j) => j.name === 'Build');
                const buildFailed = build && build.status === 'completed' && build.conclusion !== 'success';
                const hasTests = tracked.some((j) => j.name.startsWith('Test '));
                const allDone = tracked.every((j) => j.status === 'completed');
                if ((hasTests && allDone) || buildFailed) break;
              }

              await new Promise((r) => setTimeout(r, 30000));
            }

  # Scheduled runs fire every 3 hours whether or not anything moved. Skip the
  # whole workflow when the exact (monitor-oxc, oxc) commit pair already has a
  # green run recorded by the `record` job below. PR / push / dispatch runs are
  # never skipped: the guard only runs on `schedule`, and the jobs treat a
  # skipped guard as "changed".
  guard:
    name: Guard
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      unchanged: ${{ steps.marker.outputs.cache-hit }}
    steps:
      - name: Resolve oxc main commit
        id: oxc
        run: echo "sha=$(gh api repos/oxc-project/oxc/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check for a green run with identical inputs
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .green-marker
          key: green-${{ github.sha }}-${{ steps.oxc.outputs.sha }}
          lookup-only: true

  build:
    name: Build
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.unchanged != 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      oxc-sha: ${{ steps.oxc.outputs.sha }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Checkout oxc (${{ inputs.ref }})
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: oxc-project/oxc
          ref: ${{ inputs.ref }}
          path: oxc

      - run: mv oxc ../oxc

      - name: Get oxc commit
        id: oxc
        run: echo "sha=$(git -C ../oxc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Reuse the binary when neither oxc nor our sources changed (common for
      # the 3-hourly scheduled runs), skipping the ~2 minute build.
      - name: Restore binary cache
        id: binary-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./target/release/monitor-oxc
          key: binary-${{ runner.os }}-${{ steps.oxc.outputs.sha }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**') }}

      - uses: oxc-project/setup-rust@23f38cfb0c04af97a055f76acee94d5be71c7c82 # v1.0.16
        if: steps.binary-cache.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}

      - run: cargo build --release
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: "-C debug-assertions=true"

      # Explicit save right after the build: the combined actions/cache form
      # only saves when the whole job succeeds, so red periods — when
      # identical reruns are most frequent — would never populate the cache.
      - name: Save binary cache
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./target/release/monitor-oxc
          key: binary-${{ runner.os }}-${{ steps.oxc.outputs.sha }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**') }}

      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: monitor-oxc
          path: ./target/release/monitor-oxc

  test:
    name: Test
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - command: codegen
          - command: compressor
          - command: dce
          - command: transformer
          - command: mangler
          - command: whitespace
          - command: formatter
          - command: formatter_dcr
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monitor-oxc

      - run: chmod +x ./monitor-oxc

      - uses: oxc-project/setup-node@ab97f03642370d79a7e96dd286bd02a1be40e0ba # v1.3.0

      - run: ./monitor-oxc ${{ matrix.command }}
        env:
          RUST_BACKTRACE: "1"

  isolated_declarations:
    needs: build
    name: Test Isolated Declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: vuejs/core
          ref: main

      - uses: oxc-project/setup-node@ab97f03642370d79a7e96dd286bd02a1be40e0ba # v1.3.0

      - run: ./node_modules/.bin/tsc -p tsconfig.build.json --noCheck

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monitor-oxc

      - run: chmod +x ./monitor-oxc

      - run: ./monitor-oxc id .

  test262:
    name: Test262
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.unchanged != 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oxc (${{ inputs.ref }})
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: oxc-project/oxc
          ref: ${{ inputs.ref }}

      - name: Get test262 SHA pinned by oxc
        id: test262
        # Fail loudly if extraction breaks (e.g. oxc renames the constant) —
        # an empty ref would silently check out test262's default branch.
        run: |
          sha=$(grep 'const TEST262_SHA' .github/scripts/clone-parallel.mjs | cut -d'"' -f2)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Failed to extract test262 SHA from clone-parallel.mjs (got: '$sha')"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          show-progress: false
          repository: tc39/test262
          path: tasks/coverage/test262
          ref: ${{ steps.test262.outputs.sha }}

      - name: Get oxc commit
        id: oxc
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Reuse the compiled coverage runner when oxc is unchanged, skipping the
      # ~2 minute build. The binary locates the repo from the working directory
      # (project-root crate), so on a hit it runs without cargo.
      - name: Restore oxc_coverage cache
        id: coverage-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage/oxc_coverage
          key: oxc-coverage-${{ runner.os }}-${{ steps.oxc.outputs.sha }}

      - uses: oxc-project/setup-rust@23f38cfb0c04af97a055f76acee94d5be71c7c82 # v1.0.16
        if: steps.coverage-cache.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: test262

      - uses: oxc-project/setup-node@ab97f03642370d79a7e96dd286bd02a1be40e0ba # v1.3.0

      - run: cargo coverage runtime
        if: steps.coverage-cache.outputs.cache-hit != 'true'

      # Save before `git diff` so snapshot drift (a red run) doesn't discard
      # the compiled binary — red periods are exactly when identical 3-hourly
      # reruns pile up.
      - name: Save oxc_coverage cache
        if: steps.coverage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage/oxc_coverage
          key: oxc-coverage-${{ runner.os }}-${{ steps.oxc.outputs.sha }}

      - run: ./target/coverage/oxc_coverage runtime
        if: steps.coverage-cache.outputs.cache-hit == 'true'

      - run: git diff --exit-code

  # Remember which (monitor-oxc, oxc) commit pair last passed on a scheduled
  # run, so the guard can skip identical future runs. Keyed on the oxc commit
  # the Build job actually tested, not the one the guard resolved — if oxc main
  # moves mid-run they differ, and the safe outcome is an extra run, not a
  # wrong skip.
  record:
    name: Record green run
    needs: [build, test, isolated_declarations, test262]
    if: >-
      github.event_name == 'schedule' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.isolated_declarations.result == 'success' &&
      needs.test262.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: touch .green-marker

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .green-marker
          key: green-${{ github.sha }}-${{ needs.build.outputs.oxc-sha }}
